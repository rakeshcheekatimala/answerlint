name: Dependency security

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - osv-scanner.toml
      - .github/workflows/dependency-security.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - osv-scanner.toml
      - .github/workflows/dependency-security.yml
  schedule:
    - cron: "23 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    name: OSV vulnerability scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --config=osv-scanner.toml
      fail-on-vuln: true
      upload-sarif: true
      results-file-name: osv-results.sarif
    permissions:
      contents: read
      actions: read
      security-events: write

  guarddog:
    name: GuardDog malicious-package scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Scan locked npm dependencies
        run: >
          uvx --from guarddog==2.9.0
          guarddog npm verify package-lock.json
          --output-format=sarif
          > guarddog-results.sarif

      - name: Upload GuardDog results
        if: ${{ !cancelled() && hashFiles('guarddog-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: guarddog-npm
          sarif_file: guarddog-results.sarif
