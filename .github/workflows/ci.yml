name: Tests, coverage, and audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.20.8
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        if: ${{ matrix.node-version != '18.20.8' }}
        run: npm test

      - name: Test packaged CLI on Node.js 18
        if: ${{ matrix.node-version == '18.20.8' }}
        run: npm run test:cli-smoke

  coverage-and-audit:
    name: Coverage and dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Enforce 85% line coverage
        run: npm run test:coverage

      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complete dependency graph
        run: npm audit --audit-level=critical

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Verify package contents
        run: npm run size:pack

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
